name: release
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (no API token stored anywhere)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: tag must match pyproject and server.json versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" pyproject.toml
          python3 -c "import json,sys; d=json.load(open('server.json')); sys.exit(not (d['version']==d['packages'][0]['version']=='$v'))"
      - run: pipx run build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # MCP Registry GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: wait for PyPI to serve the new version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/k8s-traps/$v/json" >/dev/null && exit 0; sleep 10
          done; exit 1
      - name: install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
